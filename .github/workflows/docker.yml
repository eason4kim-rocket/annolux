name: Publish images

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: api
          - target: mcp
            image: mcp
          - target: web
            image: web
    steps:
      - name: Record frozen web publication gate
        if: matrix.target == 'web' && vars.ANNOLUX_LEGAL_READY != 'true'
        run: echo 'Web image publication is frozen until verified legal identity is configured.' >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve immutable source revision
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        id: source
        env:
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_sha="$EVENT_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            source_sha="$WORKFLOW_RUN_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short=${source_sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate verified release site
        if: matrix.target == 'web' && vars.ANNOLUX_LEGAL_READY == 'true'
        env:
          ANNOLUX_LEGAL_NAME: ${{ secrets.ANNOLUX_LEGAL_NAME }}
          ANNOLUX_LEGAL_COUNTRY: ${{ secrets.ANNOLUX_LEGAL_COUNTRY }}
          ANNOLUX_GOVERNING_LAW: ${{ secrets.ANNOLUX_GOVERNING_LAW }}
        run: |
          go run ./tools/sitegen --release
          bash scripts/release-check.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        with:
          images: ghcr.io/eason4kim-rocket/annolux
          tags: |
            type=raw,value=${{ matrix.image }}-sha-${{ steps.source.outputs.short }}
            type=semver,pattern=${{ matrix.image }}-{{version}}
            type=raw,value=${{ matrix.image }}-latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Annolux ${{ matrix.image }}
            org.opencontainers.image.description=Annolux ${{ matrix.image }} image
            org.opencontainers.image.source=https://github.com/eason4kim-rocket/annolux
            org.opencontainers.image.licenses=Apache-2.0
            io.modelcontextprotocol.server.name=${{ matrix.target == 'mcp' && 'io.github.eason4kim-rocket/annolux' || '' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.source.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Record immutable digest
        if: matrix.target != 'web' || vars.ANNOLUX_LEGAL_READY == 'true'
        run: echo '${{ matrix.target }}=${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
