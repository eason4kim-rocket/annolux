map $uri $annolux_cache_control {
    default "public, max-age=0, must-revalidate";
    # try_files internally rewrites clean URLs to */index.html before response
    # headers are evaluated, so match both the public and internal URI forms.
    ~^/(?:zh/)?(?:account|login|playground)(?:/index\.html)?$ "no-store";
    ~^/(?:zh/)?(?:billing/checkout|checkout/success)(?:/index\.html)?$ "no-store";
}

map $uri $annolux_404_page {
    default /404.html;
    ~^/zh(?:/|$) /zh/404.html;
}

map "$arg_lang:$uri" $annolux_language_redirect {
    default "";
    "zh:/index.html" /zh/;
    ~^zh:/zh(?:/|$) "";
    ~^zh:(/.*)\.html$ /zh$1;
    ~^zh:(/.*)$ /zh$1;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.annolux.com https://*.paddle.com https://cloudflareinsights.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://*.paddle.com; img-src 'self' data:; object-src 'none'; script-src 'self' https://cdn.paddle.com https://static.cloudflareinsights.com; style-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $annolux_cache_control always;

    if ($host = www.annolux.com) {
        return 301 https://annolux.com$request_uri;
    }

    if ($annolux_language_redirect != "") {
        return 301 https://annolux.com$annolux_language_redirect;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /.annolux-site-build.json {
        return 404;
    }

    location = /index.html {
        return 301 https://annolux.com/;
    }

    location = /zh/index.html {
        return 301 https://annolux.com/zh/;
    }

    location ~ ^(.+)/index\.html$ {
        return 301 https://annolux.com$1$is_args$args;
    }

    location ~ ^(.+)\.html$ {
        return 301 https://annolux.com$1$is_args$args;
    }

    location ~* \.(?:css|ico|js|png|svg|woff2)$ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /zh/ {
        try_files /zh/index.html =404;
    }

    location ~ ^(.+)/$ {
        return 301 https://annolux.com$1$is_args$args;
    }

    location / {
        try_files $uri/index.html $uri =404;
    }

    error_page 404 =404 $annolux_404_page;
    location = /404.html {
        internal;
    }
    location = /zh/404.html {
        internal;
    }
}
